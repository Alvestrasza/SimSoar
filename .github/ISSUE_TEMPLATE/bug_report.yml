name: Bug Report
description: Report a bug in SimSoar
title: "[Bug]: "
labels: ["bug", "triage"]
type: bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.
        Please fill out the required fields so we can reproduce the issue.

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Briefly describe what went wrong.
      placeholder: Example: The upload page crashes after selecting an IGC file.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please describe exactly how we can reproduce the problem.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Upload ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did the bug occur?
      options:
        - Production
        - Development
        - Local setup
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SimSoar version / commit
      description: If known, enter the version, release, or commit hash.
      placeholder: "v0.1.6 or commit hash"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste relevant logs, browser console output, or server errors here.
      render: shell
    validations:
      required: false

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots or files
      description: Upload screenshots or sample files if helpful.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and did not find a duplicate.
          required: true
        - label: I have provided enough information to reproduce the issue.
          required: true