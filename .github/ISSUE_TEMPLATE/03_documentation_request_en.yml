name: Documentation Request
description: Request new or improved documentation for SimSoar.
title: '[Docs]: '
labels:
- documentation
- triage
body:
- type: markdown
  attributes:
    value: 'Thank you for helping improve SimSoar documentation.


      Please describe what is missing, unclear, outdated, or incorrect.'
- type: checkboxes
  id: duplicate_check
  attributes:
    label: Duplicate check
    options:
    - label: I have searched existing issues and did not find a duplicate documentation request.
      required: true
    description: Please search the existing issues before creating a new documentation request.
- type: dropdown
  id: documentation_area
  attributes:
    label: Documentation area
    options:
    - Installation
    - Configuration
    - Deployment
    - Operations
    - User Guide
    - Admin Guide
    - Developer Guide
    - API / Interfaces
    - Security
    - Troubleshooting
    - Other
    description: Which area needs documentation?
  validations:
    required: true
- type: textarea
  id: requested_change
  attributes:
    label: What should be documented or changed?
    description: Describe the missing, unclear, outdated, or incorrect documentation.
    placeholder: 'Example: The production deployment steps do not explain how to configure the systemd service override.'
  validations:
    required: true
- type: textarea
  id: expected_documentation
  attributes:
    label: Expected documentation
    description: What should the documentation explain?
    placeholder: 'The documentation should include:

      - Required paths

      - Required environment variables

      - Exact commands

      - Verification steps'
  validations:
    required: true
- type: textarea
  id: affected_files
  attributes:
    label: Affected documentation files or pages
    description: Link or name the affected files/pages if known.
    placeholder: 'Example: README.md, docs/deployment/production.md, Wiki page URL'
  validations:
    required: false
- type: textarea
  id: additional_context
  attributes:
    label: Additional context
    description: Add anything else that may help us improve the documentation.
  validations:
    required: false
