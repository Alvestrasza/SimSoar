name: Feature Request
description: Suggest an improvement or new feature for SimSoar.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for SimSoar.

        Please describe the problem, the proposed solution, and the expected benefit.
        Clear feature requests are easier to evaluate, prioritize, and implement.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate check
      description: Please search the existing issues before creating a new feature request.
      options:
        - label: I have searched the existing issues and did not find a duplicate feature request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem should this feature solve?
      placeholder: "Example: Admins currently cannot delete users or uploaded flights from the web interface."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the feature or behavior you would like to see.
      placeholder: "Example: Add an admin page where authorized admins can delete users and flights."
    validations:
      required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature area
      description: Which part of SimSoar is affected?
      options:
        - Authentication / User Management
        - Flight Upload
        - Flight Analysis
        - Flight Details
        - Leaderboards / Rankings
        - Admin Area
        - UI / UX
        - Dark Mode / Appearance
        - Documentation
        - Deployment / Operations
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      description: How important is this feature from your perspective?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be considered complete?
      placeholder: |
        - Admins can see a list of users.
        - Admins can delete a selected user after confirmation.
        - Admin actions are logged.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you considered.
    validations:
      required: false

  - type: upload
    id: mockups
    attributes:
      label: Mockups, screenshots, or references
      description: Upload mockups, screenshots, or references if helpful.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that may help us evaluate this request.
    validations:
      required: false
